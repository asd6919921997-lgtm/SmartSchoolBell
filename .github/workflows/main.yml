name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Fix Kotlin Duplicate Classes
        run: |
          echo "configurations.all {" >> android/app/build.gradle
          echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" >> android/app/build.gradle
          echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      - name: Accept Android SDK Licenses
        run: yes | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Ensure Keystore Exists
        run: |
          if [ ! -f android/app/smart_school_bell.keystore ]; then
            echo "Generating signing keystore..."
            keytool -genkey -v -keystore android/app/smart_school_bell.keystore \
              -alias smartschool \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass SmartSchoolPass2026! \
              -keypass SmartSchoolPass2026! \
              -dname "CN=Smart School Bell, OU=Education, O=Smart School, L=Riyadh, ST=Riyadh, C=SA"
          fi

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Signed Release APK
        run: |
          cd android
          ./gradlew assembleRelease -x lint -x lintVitalRelease --no-daemon --stacktrace

      - name: Organize Output Files
        run: |
          mkdir -p dist-apk
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} dist-apk/SmartSchoolBell_Signed.apk \;
          cp smart_school_certificate.crt dist-apk/SmartSchoolCertificate.crt 2>/dev/null || true
          ls -la dist-apk/

      - name: Upload APK & Certificate
        uses: actions/upload-artifact@v4
        with:
          name: SmartSchoolBell_Android_APK
          path: dist-apk/*
          retention-days: 30
