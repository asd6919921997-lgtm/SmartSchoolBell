name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21 (Required for Capacitor 8)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Signed Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Organize Output Files
        run: |
          mkdir -p dist-apk
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} dist-apk/SmartSchoolBell_Signed.apk \;
          cp smart_school_certificate.crt dist-apk/SmartSchoolCertificate.crt 2>/dev/null || true
          ls -la dist-apk/

      - name: Upload APK & Certificate
        uses: actions/upload-artifact@v4
        with:
          name: SmartSchoolBell_Android_APK
          path: dist-apk/*
          retention-days: 30
